<!doctype html>
<html><head><meta charset="utf-8"><title>S5 timeout and restart</title></head>
<body>
<script type="module">
import { PyWorker, makeChecks, publish } from "./lib.js";

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const TIMEOUT_MS = 5000;

// Run `code` with a hard timeout. On timeout the worker is terminated and the promise rejects.
// This is the pattern the real python runner uses.
function runWithTimeout(pw, code, ms) {
  let timer;
  const timeout = new Promise((_, reject) => {
    timer = setTimeout(() => { pw.terminate(); reject(new Error("TIMEOUT")); }, ms);
  });
  return Promise.race([pw.run(code), timeout]).finally(() => clearTimeout(timer));
}

// Boots a worker and times it until print(1) reaches the main thread.
async function bootAndPrint(packages) {
  const t0 = performance.now();
  const pw = new PyWorker();
  await pw.init();
  if (packages) await pw.load(packages);
  const r = await pw.run(`print(1)`);
  const ms = performance.now() - t0;
  return { pw, ms, stdout: r.stdout };
}

publish(async () => {
  const c = makeChecks();

  // Warm the HTTP cache with a first boot (also reported: it is not a cold-profile number).
  const first = await bootAndPrint();
  first.pw.terminate();

  const pw = new PyWorker();
  await pw.init();

  // While the worker spins, a ping posted to it must stay unanswered (the worker is blocked).
  const pingId = pw.nextId + 1000;
  let pongSeen = false;
  const hangStart = performance.now();
  let timedOut = false;
  const hang = runWithTimeout(pw, `while True: pass`, TIMEOUT_MS).catch((e) => { timedOut = e.message === "TIMEOUT"; });
  await sleep(1000);
  pw.worker.addEventListener("message", () => { pongSeen = true; });
  pw.worker.postMessage({ id: pingId, type: "run", code: "1" });
  await hang;
  const hangMs = performance.now() - hangStart;
  const terminatedAt = performance.now();
  c.check("while True: pass never returns; main thread terminates it at 5 s", timedOut && hangMs >= TIMEOUT_MS - 50 && hangMs < TIMEOUT_MS + 500, { hangMs });
  c.check("blocked worker never answered a message queued during the loop", pongSeen === false, { pongSeen });

  // Fresh worker after the kill, same cache state (warm): time until print(1) is seen.
  const restarts = [];
  for (let i = 0; i < 3; i++) {
    const t0 = i === 0 ? terminatedAt : performance.now();
    const r = await bootAndPrint();
    restarts.push({ msFromTerminateOrStart: performance.now() - t0, bootToPrintMs: r.ms, stdout: r.stdout });
    r.pw.terminate();
  }
  c.check("fresh worker runs print(1) after the kill", restarts.every((r) => JSON.stringify(r.stdout) === '["1"]'), restarts);

  // Same, but with the FastAPI package set the fastapi runner needs.
  const fa = await bootAndPrint(["fastapi", "pydantic", "httpx", "sqlalchemy", "bcrypt"]);
  fa.pw.terminate();

  const sorted = restarts.map((r) => r.bootToPrintMs).sort((a, b) => a - b);
  return {
    ok: c.ok,
    checks: c.list,
    timeoutMs: TIMEOUT_MS,
    firstBootToPrintMs: first.ms,
    hangMs,
    restartWarmCoreOnlyMs: restarts.map((r) => r.bootToPrintMs),
    restartWarmCoreOnlyMedianMs: sorted[1],
    restartWarmFastapiSetMs: fa.ms,
  };
});
</script>
</body></html>
